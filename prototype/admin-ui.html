<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shorthand · 管理后台 UI 原型</title>
<!--
  THROWAWAY UI PROTOTYPE — not production code.
  Three structurally different admin console directions, switchable with ?variant=A|B|C.
-->
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; }
  button { cursor: pointer; border: none; background: none; color: inherit; }
  input { outline: none; }
  svg { display: block; }
  table { border-collapse: collapse; width: 100%; }

  /* ── Variant A · Mission Control ────────────────────────────────────── */
  body.v-A {
    --bg: #08090b;
    --panel: #0d1013;
    --panel-2: #101419;
    --line: #1c2228;
    --ink: #e7ecf2;
    --muted: #78828e;
    --accent: #c8f560;
    --cyan: #63e6ff;
    background: var(--bg);
    color: var(--ink);
  }
  body.v-A::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 40% 20%, #000 0%, transparent 75%);
    z-index: 0;
  }
  .a-shell { position: relative; z-index: 1; display: grid; grid-template-columns: 76px 1fr; min-height: 100vh; }
  .a-rail {
    position: sticky; top: 0; height: 100vh;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center;
    padding: 18px 0;
    background: rgba(8,9,11,.82);
    backdrop-filter: blur(12px);
  }
  .a-logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--accent); color: #060806;
    display: grid; place-items: center;
    font-weight: 800; font-size: 18px; letter-spacing: -.04em;
    box-shadow: 0 0 24px rgba(200,245,96,.16);
  }
  .a-nav { display: flex; flex-direction: column; gap: 6px; margin-top: 34px; width: 100%; align-items: center; }
  .a-nav button {
    width: 46px; height: 44px; border-radius: 12px;
    display: grid; place-items: center;
    color: var(--muted);
    transition: background .18s, color .18s;
  }
  .a-nav button:hover { background: #14191f; color: var(--ink); }
  .a-nav button.active { background: rgba(200,245,96,.1); color: var(--accent); }
  .a-nav svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .a-rail-bottom { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .a-rail-bottom .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .a-rail-bottom .v { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 9px; color: var(--muted); writing-mode: vertical-rl; letter-spacing: .18em; }

  .a-main { padding: 24px 34px 40px; min-width: 0; }
  .a-top { display: flex; align-items: center; gap: 20px; margin-bottom: 26px; }
  .a-eyebrow { font-family: ui-monospace, Consolas, monospace; font-size: 9px; letter-spacing: .2em; color: var(--muted); margin-bottom: 4px; }
  .a-top h1 { font-size: 24px; line-height: 1; margin: 0; letter-spacing: -.03em; font-weight: 600; }
  .a-search {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    width: min(320px, 30vw);
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); padding: 9px 12px;
    color: var(--muted); font-size: 12px;
  }
  .a-search input { background: transparent; border: 0; color: var(--ink); width: 100%; font-size: 12px; }
  .a-search input::placeholder { color: #59636f; }
  .a-status {
    display: flex; align-items: center; gap: 7px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 9px; letter-spacing: .12em; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 11px;
    white-space: nowrap;
  }
  .a-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 9px var(--accent); animation: blink 2.2s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .a-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: #1a2027; border: 1px solid #2a333d;
    display: grid; place-items: center;
    font-size: 10px; font-weight: 600; color: var(--accent);
  }

  .a-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .a-kpi {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-radius: 14px;
    padding: 15px 16px 12px; position: relative; overflow: hidden;
  }
  .a-kpi::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(200,245,96,.35), transparent); }
  .a-kpi .label { font-size: 10px; color: var(--muted); letter-spacing: .05em; }
  .a-kpi .value { font-family: ui-monospace, Consolas, monospace; font-size: 30px; letter-spacing: -.04em; margin: 7px 0 3px; }
  .a-kpi .delta { font-size: 10px; color: #6f7a86; }
  .a-kpi .delta b { color: var(--accent); font-weight: 500; }
  .a-spark { position: absolute; right: 12px; bottom: 10px; opacity: .75; }

  .a-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; align-items: start; }
  .a-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .a-panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .a-panel-head h2 { font-size: 12px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .a-panel-head .sub { font-family: ui-monospace, Consolas, monospace; font-size: 9px; color: var(--muted); margin-left: auto; }
  .a-table th { text-align: left; font-size: 9px; letter-spacing: .1em; color: var(--muted); font-weight: 500; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .a-table td { padding: 12px 16px; font-size: 12px; border-bottom: 1px solid #14191e; }
  .a-table tr:last-child td { border-bottom: 0; }
  .a-table tbody tr:hover { background: #10151a; }
  .a-code { font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: var(--muted); letter-spacing: .04em; }
  .a-book { display: flex; flex-direction: column; gap: 2px; }
  .a-book b { font-weight: 500; }
  .a-progress { width: 100%; height: 4px; border-radius: 99px; background: #1a2026; overflow: hidden; }
  .a-progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .a-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--accent); }
  .a-pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .a-pill.draft { color: #d5a35a; }
  .a-pill.draft::before { background: #d5a35a; }
  .a-side { display: flex; flex-direction: column; gap: 16px; }
  .a-sys { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
  .a-sys div { background: var(--panel); padding: 12px 14px; }
  .a-sys span { display: block; font-size: 9px; color: var(--muted); letter-spacing: .06em; margin-bottom: 4px; }
  .a-sys b { font-family: ui-monospace, Consolas, monospace; font-size: 15px; font-weight: 500; }
  .a-log { padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 9px; }
  .a-log-row { display: grid; grid-template-columns: 44px 54px 1fr; gap: 8px; font-family: ui-monospace, Consolas, monospace; font-size: 9.5px; color: var(--muted); }
  .a-log-row .t { color: #53606c; }
  .a-log-row .k { color: var(--accent); }
  .a-log-row .k.sys { color: var(--cyan); }
  .a-log-row .m { color: #9aa5b1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .a-bottom { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; margin-top: 16px; }
  .a-bars { display: flex; align-items: flex-end; gap: 5px; height: 124px; padding: 16px 16px 22px; }
  .a-bar { flex: 1; min-height: 4px; border-radius: 2px 2px 0 0; background: linear-gradient(180deg, var(--accent), rgba(200,245,96,.12)); position: relative; opacity: .9; }
  .a-bar span { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); font-family: ui-monospace, Consolas, monospace; font-size: 7px; color: #53606c; }
  .a-users { display: flex; flex-direction: column; }
  .a-user { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #14191e; }
  .a-user:last-child { border-bottom: 0; }
  .a-user .ava { width: 26px; height: 26px; border-radius: 50%; background: #1a2027; border: 1px solid #2a333d; display: grid; place-items: center; font-size: 9px; color: var(--accent); }
  .a-user .info { flex: 1; min-width: 0; }
  .a-user .info b { display: block; font-size: 11px; font-weight: 500; }
  .a-user .info span { display: block; font-size: 9px; color: var(--muted); margin-top: 2px; }
  .a-user .time { font-family: ui-monospace, Consolas, monospace; font-size: 9px; color: #53606c; }
  .a-foot { display: flex; gap: 16px; margin-top: 18px; font-family: ui-monospace, Consolas, monospace; font-size: 9px; color: #4f5a66; letter-spacing: .06em; }

  /* ── Variant B · Blueprint ──────────────────────────────────────────── */
  body.v-B {
    --bg: #f0f2f0;
    --panel: #ffffff;
    --line: #d5dad6;
    --ink: #0b0f0e;
    --muted: #6b746e;
    --accent: #ff4d00;
    background: var(--bg);
    color: var(--ink);
  }
  body.v-B::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(11,15,14,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(11,15,14,.045) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }
  .b-wrap { position: relative; z-index: 1; max-width: 1360px; margin: 0 auto; padding: 0 30px 40px; }
  .b-top { display: flex; align-items: center; gap: 28px; height: 72px; border-bottom: 1px solid var(--line); }
  .b-brand { display: flex; align-items: baseline; gap: 9px; letter-spacing: -.04em; font-weight: 800; font-size: 20px; }
  .b-brand span { font-family: ui-monospace, Consolas, monospace; font-size: 9px; letter-spacing: .12em; color: var(--muted); font-weight: 400; }
  .b-nav { display: flex; gap: 20px; margin-left: 18px; }
  .b-nav button { font-size: 12px; color: var(--muted); padding: 6px 0; border-bottom: 1px solid transparent; }
  .b-nav button.active { color: var(--ink); border-bottom-color: var(--accent); }
  .b-top .meta { margin-left: auto; font-family: ui-monospace, Consolas, monospace; font-size: 9px; color: var(--muted); letter-spacing: .08em; }
  .b-hero { display: grid; grid-template-columns: 1.2fr .8fr; align-items: end; padding: 38px 0 28px; border-bottom: 1px solid var(--line); }
  .b-kicker { font-family: ui-monospace, Consolas, monospace; font-size: 9px; letter-spacing: .16em; color: var(--accent); margin-bottom: 10px; }
  .b-hero h1 { font-size: 44px; line-height: 1; letter-spacing: -.05em; margin: 0; font-weight: 650; }
  .b-hero p { margin: 12px 0 0; font-size: 12px; color: var(--muted); max-width: 420px; line-height: 1.7; }
  .b-big { justify-self: end; text-align: right; font-family: ui-monospace, Consolas, monospace; font-size: 72px; line-height: .9; letter-spacing: -.07em; }
  .b-big span { display: block; font-family: -apple-system, "PingFang SC", sans-serif; font-size: 10px; letter-spacing: .12em; color: var(--muted); margin-top: 10px; }
  .b-strip { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
  .b-metric { padding: 18px 20px 16px; border-right: 1px solid var(--line); }
  .b-metric:first-child { padding-left: 0; }
  .b-metric:last-child { border-right: 0; }
  .b-metric .label { font-family: ui-monospace, Consolas, monospace; font-size: 9px; letter-spacing: .1em; color: var(--muted); }
  .b-metric .value { font-family: ui-monospace, Consolas, monospace; font-size: 27px; letter-spacing: -.04em; margin: 7px 0 2px; }
  .b-metric .delta { font-size: 10px; color: var(--muted); }
  .b-metric .delta b { color: var(--accent); font-weight: 600; }
  .b-cols { display: grid; grid-template-columns: 1.5fr .8fr; gap: 26px; margin-top: 24px; }
  .b-panel { background: var(--panel); border: 1px solid var(--line); }
  .b-panel-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .b-panel-head h2 { font-size: 13px; margin: 0; font-weight: 650; }
  .b-panel-head .idx { font-family: ui-monospace, Consolas, monospace; font-size: 9px; color: var(--muted); }
  .b-panel-head .right { margin-left: auto; font-family: ui-monospace, Consolas, monospace; font-size: 9px; color: var(--muted); }
  .b-table th { text-align: left; font-family: ui-monospace, Consolas, monospace; font-size: 9px; letter-spacing: .08em; color: var(--muted); font-weight: 500; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .b-table td { padding: 13px 16px; font-size: 12px; border-bottom: 1px solid #eceeec; }
  .b-table tr:last-child td { border-bottom: 0; }
  .b-table tbody tr:hover { background: #fafbf9; }
  .b-table b { font-weight: 600; }
  .b-code { font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: var(--muted); }
  .b-bar { height: 5px; background: #e8ebe7; width: 100%; }
  .b-bar i { display: block; height: 100%; background: var(--accent); }
  .b-status { font-family: ui-monospace, Consolas, monospace; font-size: 9px; letter-spacing: .06em; }
  .b-status.live { color: #16803c; }
  .b-status.draft { color: var(--accent); }
  .b-side { display: flex; flex-direction: column; gap: 18px; }
  .b-import { padding: 16px; }
  .b-drop { border: 1px dashed #b9c0ba; padding: 22px 14px; text-align: center; background: #fafbf9; }
  .b-drop b { display: block; font-size: 12px; margin-bottom: 4px; }
  .b-drop span { font-size: 10px; color: var(--muted); }
  .b-drop button { margin-top: 12px; background: var(--accent); color: #fff; padding: 8px 14px; font-size: 11px; font-weight: 600; }
  .b-log { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .b-log-row { display: grid; grid-template-columns: 42px 1fr; gap: 10px; font-family: ui-monospace, Consolas, monospace; font-size: 9.5px; }
  .b-log-row .t { color: #9aa29c; }
  .b-log-row .m { color: #39413c; }
  .b-log-row .m b { color: var(--accent); font-weight: 500; }
  .b-foot { display: flex; justify-content: space-between; margin-top: 26px; font-family: ui-monospace, Consolas, monospace; font-size: 9px; color: #8b938d; letter-spacing: .06em; }

  /* ── Variant C · Terminal ───────────────────────────────────────────── */
  body.v-C {
    --bg: #050505;
    --panel: #0a0a0a;
    --line: #242424;
    --ink: #f1f1f1;
    --muted: #858585;
    --accent: #c6ff00;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, "Cascadia Code", Consolas, "PingFang SC", monospace;
  }
  body.v-C::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 4px);
    opacity: .5; z-index: 2;
  }
  .c-shell { position: relative; z-index: 3; display: grid; grid-template-columns: 58px 1fr; min-height: 100vh; }
  .c-rail { border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 18px 0; position: sticky; top: 0; height: 100vh; }
  .c-mark { color: var(--accent); font-size: 22px; font-weight: 700; letter-spacing: -.08em; }
  .c-vert { writing-mode: vertical-rl; margin-top: 26px; font-size: 9px; letter-spacing: .3em; color: var(--muted); }
  .c-rail .bottom { margin-top: auto; color: var(--accent); font-size: 9px; writing-mode: vertical-rl; letter-spacing: .2em; }
  .c-main { padding: 18px 26px 34px; min-width: 0; }
  .c-top { display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 13px; font-size: 10px; color: var(--muted); letter-spacing: .08em; }
  .c-top b { color: var(--ink); font-weight: 500; }
  .c-top .right { margin-left: auto; display: flex; gap: 18px; }
  .c-hero { display: grid; grid-template-columns: 1.25fr .75fr; gap: 20px; padding: 26px 0 22px; border-bottom: 1px solid var(--line); }
  .c-h1 { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .c-big { font-size: 74px; line-height: .9; letter-spacing: -.08em; color: var(--ink); }
  .c-big em { font-style: normal; color: var(--accent); }
  .c-sub { margin-top: 10px; font-size: 10px; color: var(--muted); }
  .c-terminal { border: 1px solid var(--line); background: #070707; padding: 13px 15px; font-size: 10px; line-height: 1.8; color: var(--muted); }
  .c-terminal .ok { color: var(--accent); }
  .c-terminal .cmd { color: var(--ink); }
  .c-terminal .cursor { display: inline-block; width: 7px; height: 11px; background: var(--accent); animation: cur 1s steps(1) infinite; vertical-align: -1px; }
  @keyframes cur { 50% { opacity: 0; } }
  .c-metrics { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
  .c-metric { padding: 15px 16px 13px; border-right: 1px solid var(--line); }
  .c-metric:first-child { padding-left: 0; }
  .c-metric:last-child { border-right: 0; }
  .c-metric .k { font-size: 9px; color: var(--muted); letter-spacing: .1em; }
  .c-metric .v { font-size: 24px; letter-spacing: -.05em; margin-top: 6px; }
  .c-cols { display: grid; grid-template-columns: 1.45fr .85fr; gap: 20px; margin-top: 18px; }
  .c-panel { border: 1px solid var(--line); background: var(--panel); }
  .c-panel-head { display: flex; align-items: center; gap: 10px; padding: 10px 13px; border-bottom: 1px solid var(--line); font-size: 10px; color: var(--muted); letter-spacing: .08em; }
  .c-panel-head b { color: var(--ink); font-weight: 500; }
  .c-panel-head .right { margin-left: auto; color: var(--accent); }
  .c-table th { text-align: left; font-size: 9px; color: var(--muted); font-weight: 400; padding: 9px 13px; border-bottom: 1px solid var(--line); letter-spacing: .06em; }
  .c-table td { padding: 11px 13px; font-size: 10.5px; border-bottom: 1px solid #161616; }
  .c-table tr:last-child td { border-bottom: 0; }
  .c-table tbody tr:hover { background: #111; }
  .c-table .book b { color: var(--ink); font-weight: 500; }
  .c-table .book span { display: block; color: var(--muted); font-size: 9px; margin-top: 2px; }
  .c-bar { height: 3px; background: #1c1c1c; width: 100%; }
  .c-bar i { display: block; height: 100%; background: var(--accent); }
  .c-tag { color: var(--accent); }
  .c-tag.draft { color: #d0a24a; }
  .c-side { display: flex; flex-direction: column; gap: 18px; }
  .c-log { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 9.5px; line-height: 1.55; }
  .c-log-row { display: grid; grid-template-columns: 40px 1fr; gap: 9px; }
  .c-log-row .t { color: #555; }
  .c-log-row .m { color: #a5a5a5; }
  .c-log-row .m b { color: var(--accent); font-weight: 400; }
  .c-sys { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
  .c-sys div { background: var(--panel); padding: 11px 13px; }
  .c-sys span { display: block; color: var(--muted); font-size: 9px; margin-bottom: 3px; }
  .c-sys b { font-size: 13px; font-weight: 400; }
  .c-foot { display: flex; justify-content: space-between; margin-top: 20px; font-size: 9px; color: #555; letter-spacing: .08em; }

  /* ── Switcher ───────────────────────────────────────────────────────── */
  .switcher {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 500; display: flex; align-items: center; gap: 10px;
    background: #101010; color: #fff; border: 1px solid #333;
    border-radius: 999px; padding: 7px 9px;
    box-shadow: 0 10px 34px rgba(0,0,0,.35);
    font-size: 11px; letter-spacing: .03em;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  .switcher button { width: 28px; height: 28px; border-radius: 50%; background: #242424; color: #fff; font-size: 16px; line-height: 1; display: grid; place-items: center; }
  .switcher button:hover { background: #333; }
  .switcher b { font-weight: 700; }
  .switcher span { white-space: nowrap; }

  @media (max-width: 980px) {
    .a-kpis { grid-template-columns: 1fr 1fr; }
    .a-grid, .b-cols, .c-cols, .c-hero, .b-hero { grid-template-columns: 1fr; }
    .b-big { justify-self: start; text-align: left; margin-top: 18px; }
    .a-search { width: auto; flex: 1; }
    .a-status { display: none; }
    .b-nav { display: none; }
    .b-strip, .c-metrics { grid-template-columns: 1fr 1fr; }
    .c-big { font-size: 58px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="switcher" id="switcher"></div>

<script>
  const BOOKS = [
    { code: "CET4", name: "四级大纲", words: "4,427", progress: 72, status: "已上架", updated: "2h ago" },
    { code: "CET6", name: "六级大纲", words: "5,515", progress: 48, status: "已上架", updated: "1d ago" },
    { code: "PHRASE", name: "四六级词组", words: "2,329", progress: 31, status: "草稿", updated: "3d ago" }
  ];

  const EVENTS = [
    ["14:32", "IMPORT", "六级大纲 · 5,515 条词条已入库"],
    ["14:18", "SYSTEM", "TTS 未启用，跳过音频任务"],
    ["13:52", "USER", "QX 完成第 3 组 · 四级大纲"],
    ["12:06", "FEEDBACK", "#12 已回复 · 用户反馈"],
    ["09:41", "AUTH", "admin 登录 · 47.95.66.191"]
  ];

  const VARIANTS = { A: "Mission Control", B: "Blueprint", C: "Terminal" };
  const params = new URLSearchParams(location.search);
  const initial = ["A", "B", "C"].includes(params.get("variant")) ? params.get("variant") : "A";
  const state = { variant: initial };

  const icons = {
    grid: '<svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>',
    book: '<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M8 4v16"/></svg>',
    list: '<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
    upload: '<svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5l5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
    users: '<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    message: '<svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8z"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>'
  };

  function sparkline(points, color) {
    const max = Math.max(...points), min = Math.min(...points);
    const w = 82, h = 24;
    const path = points.map((p, i) => {
      const x = (i / (points.length - 1)) * w;
      const y = h - ((p - min) / (max - min || 1)) * (h - 4) - 2;
      return `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
    return `<svg class="a-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  function rowsA() {
    return BOOKS.map(b => `
      <tr>
        <td><div class="a-book"><b>${b.name}</b><span class="a-code">${b.code}</span></div></td>
        <td class="a-code">${b.words}</td>
        <td><div class="a-progress"><i style="width:${b.progress}%"></i></div><span class="a-code">${b.progress}%</span></td>
        <td><span class="a-pill ${b.status === "草稿" ? "draft" : ""}">${b.status}</span></td>
        <td class="a-code">${b.updated}</td>
      </tr>`).join("");
  }

  function rowsB() {
    return BOOKS.map(b => `
      <tr>
        <td><b>${b.name}</b><div class="b-code">${b.code}</div></td>
        <td class="b-code">${b.words}</td>
        <td><div class="b-bar"><i style="width:${b.progress}%"></i></div><div class="b-code">${b.progress}%</div></td>
        <td><span class="b-status ${b.status === "草稿" ? "draft" : "live"}">${b.status === "草稿" ? "DRAFT" : "LIVE"}</span></td>
        <td class="b-code">${b.updated}</td>
      </tr>`).join("");
  }

  function rowsC() {
    return BOOKS.map(b => `
      <tr>
        <td class="book"><b>${b.name}</b><span>${b.code}</span></td>
        <td>${b.words}</td>
        <td><div class="c-bar"><i style="width:${b.progress}%"></i></div><span>${b.progress}%</span></td>
        <td><span class="c-tag ${b.status === "草稿" ? "draft" : ""}">${b.status === "草稿" ? "DRAFT" : "LIVE"}</span></td>
        <td>${b.updated}</td>
      </tr>`).join("");
  }

  function navA() {
    const items = [["grid","总览",1],["book","词书",0],["list","词条",0],["upload","导入",0],["users","用户",0],["message","反馈",0]];
    return items.map(([icon,label,active]) => `<button class="${active ? "active" : ""}" title="${label}">${icons[icon]}</button>`).join("");
  }

  function renderA() {
    return `
      <div class="a-shell">
        <aside class="a-rail">
          <div class="a-logo">S</div>
          <nav class="a-nav">${navA()}</nav>
          <div class="a-rail-bottom"><div class="dot"></div><div class="v">v0.4.2</div></div>
        </aside>
        <main class="a-main">
          <header class="a-top">
            <div><div class="a-eyebrow">SHORTHAND / CONTROL</div><h1>总览</h1></div>
            <label class="a-search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input data-search placeholder="搜索词条、词书、用户…" /></label>
            <div class="a-status"><span class="dot"></span> ALL SYSTEMS NOMINAL</div>
            <div class="a-avatar">QX</div>
          </header>

          <section class="a-kpis">
            <div class="a-kpi"><div class="label">词条总量</div><div class="value">12,271</div><div class="delta"><b>+1,842</b> / 本周</div>${sparkline([12,18,15,24,22,31,28,38], "#c8f560")}</div>
            <div class="a-kpi"><div class="label">注册用户</div><div class="value">8</div><div class="delta"><b>+2</b> / 本周</div>${sparkline([4,4,5,5,6,6,7,8], "#63e6ff")}</div>
            <div class="a-kpi"><div class="label">收藏总数</div><div class="value">1,096</div><div class="delta"><b>+86</b> / 本周</div>${sparkline([800,860,910,880,960,1010,1040,1096], "#c8f560")}</div>
            <div class="a-kpi"><div class="label">待处理反馈</div><div class="value">2</div><div class="delta"><b>需回复</b></div>${sparkline([6,5,5,3,4,2,3,2], "#d5a35a")}</div>
          </section>

          <section class="a-grid">
            <div class="a-panel">
              <div class="a-panel-head"><h2>词书运行状态</h2><span class="sub">3 BOOKS / LIVE</span></div>
              <table class="a-table"><thead><tr><th>词书</th><th>词数</th><th>学习覆盖率</th><th>状态</th><th>最近更新</th></tr></thead><tbody>${rowsA()}</tbody></table>
            </div>
            <div class="a-side">
              <div class="a-panel">
                <div class="a-panel-head"><h2>系统遥测</h2><span class="sub">REALTIME</span></div>
                <div class="a-sys">
                  <div><span>API LATENCY</span><b>42 ms</b></div>
                  <div><span>DB QUERY</span><b>12 ms</b></div>
                  <div><span>JVM HEAP</span><b>312 MB</b></div>
                  <div><span>UPTIME</span><b>12d 04h</b></div>
                </div>
              </div>
              <div class="a-panel">
                <div class="a-panel-head"><h2>事件流</h2><span class="sub">LAST 5</span></div>
                <div class="a-log">${EVENTS.map(([t,k,m]) => `<div class="a-log-row"><span class="t">${t}</span><span class="k ${k === "SYSTEM" ? "sys" : ""}">${k}</span><span class="m">${m}</span></div>`).join("")}</div>
              </div>
            </div>
          </section>

          <section class="a-bottom">
            <div class="a-panel">
              <div class="a-panel-head"><h2>学习活跃度</h2><span class="sub">14 DAYS / WORDS</span></div>
              <div class="a-bars">${[18,26,22,34,30,46,38,52,44,61,55,68,62,74].map((v,i) => `<div class="a-bar" style="height:${v}%"><span>${i+1}</span></div>`).join("")}</div>
            </div>
            <div class="a-panel">
              <div class="a-panel-head"><h2>最近用户</h2><span class="sub">8 TOTAL</span></div>
              <div class="a-users">
                <div class="a-user"><div class="ava">QX</div><div class="info"><b>QX</b><span>四级大纲 · 第 3 组</span></div><div class="time">2h</div></div>
                <div class="a-user"><div class="ava">W</div><div class="info"><b>wang</b><span>六级大纲 · 第 12 组</span></div><div class="time">5h</div></div>
                <div class="a-user"><div class="ava">L</div><div class="info"><b>lin</b><span>四级大纲 · 第 8 组</span></div><div class="time">1d</div></div>
                <div class="a-user"><div class="ava">M</div><div class="info"><b>momo</b><span>四六级词组 · 第 2 组</span></div><div class="time">2d</div></div>
              </div>
            </div>
          </section>
          <footer class="a-foot"><span>SHORTHAND ADMIN / BUILD 0.4.2</span><span>NODE 01 · 47.95.66.191</span><span>© 2026</span></footer>
        </main>
      </div>`;
  }

  function renderB() {
    return `
      <div class="b-wrap">
        <header class="b-top">
          <div class="b-brand">SHORTHAND <span>ADMIN / 01</span></div>
          <nav class="b-nav"><button class="active">总览</button><button>词书</button><button>词条</button><button>导入</button><button>用户</button><button>反馈</button></nav>
          <div class="meta">v0.4.2 · SYS OK · 47.95.66.191</div>
        </header>

        <section class="b-hero">
          <div><div class="b-kicker">CONTROL SURFACE / 2026</div><h1>词库运行台</h1><p>三本词书、12,271 条词条在一个界面里管理。导入、校对、上架，保持内容干净。</p></div>
          <div class="b-big">12,271<span>WORDS IN LIBRARY</span></div>
        </section>

        <section class="b-strip">
          <div class="b-metric"><div class="label">BOOKS</div><div class="value">3</div><div class="delta"><b>2 LIVE</b> / 1 DRAFT</div></div>
          <div class="b-metric"><div class="label">USERS</div><div class="value">8</div><div class="delta"><b>+2</b> / 本周</div></div>
          <div class="b-metric"><div class="label">FAVORITES</div><div class="value">1,096</div><div class="delta"><b>+86</b> / 本周</div></div>
          <div class="b-metric"><div class="label">FEEDBACK</div><div class="value">2</div><div class="delta"><b>OPEN</b> / 待回复</div></div>
        </section>

        <section class="b-cols">
          <div class="b-panel">
            <div class="b-panel-head"><span class="idx">01</span><h2>词书</h2><span class="right">SORT / UPDATED</span></div>
            <table class="b-table"><thead><tr><th>词书</th><th>词数</th><th>覆盖率</th><th>状态</th><th>更新</th></tr></thead><tbody>${rowsB()}</tbody></table>
          </div>
          <aside class="b-side">
            <div class="b-panel">
              <div class="b-panel-head"><span class="idx">02</span><h2>导入</h2><span class="right">EXCEL / CSV</span></div>
              <div class="b-import"><div class="b-drop"><b>拖入词书文件</b><span>.xlsx / .csv · 最大 12MB</span><button>选择文件</button></div></div>
            </div>
            <div class="b-panel">
              <div class="b-panel-head"><span class="idx">03</span><h2>事件</h2><span class="right">LAST 5</span></div>
              <div class="b-log">${EVENTS.map(([t,k,m]) => `<div class="b-log-row"><span class="t">${t}</span><span class="m"><b>${k}</b> · ${m}</span></div>`).join("")}</div>
            </div>
          </aside>
        </section>
        <footer class="b-foot"><span>SHORTHAND ADMIN · BLUEPRINT</span><span>PAGE 01 / 06</span></footer>
      </div>`;
  }

  function renderC() {
    return `
      <div class="c-shell">
        <aside class="c-rail"><div class="c-mark">S</div><div class="c-vert">SHORTHAND ADMIN</div><div class="bottom">SYS 01</div></aside>
        <main class="c-main">
          <header class="c-top"><b>SHORTHAND // ADMIN</b><span>SESSION 0x2F</span><span class="right"><span>MEM 312M</span><span>API 42MS</span><span>DB 12MS</span></span></header>
          <section class="c-hero">
            <div><div class="c-h1">LIBRARY / TOTAL WORDS</div><div class="c-big">12,<em>271</em></div><div class="c-sub">3 BOOKS · 2 LIVE · 1 DRAFT · LAST SYNC 14:32</div></div>
            <div class="c-terminal"><div><span class="ok">●</span> system online</div><div><span class="ok">●</span> mysql connected</div><div><span class="ok">●</span> import worker idle</div><div class="cmd">&gt; awaiting command <span class="cursor"></span></div></div>
          </section>
          <section class="c-metrics">
            <div class="c-metric"><div class="k">USERS</div><div class="v">8</div></div>
            <div class="c-metric"><div class="k">FAVORITES</div><div class="v">1,096</div></div>
            <div class="c-metric"><div class="k">KNOWN</div><div class="v">3,842</div></div>
            <div class="c-metric"><div class="k">FEEDBACK</div><div class="v">2</div></div>
          </section>
          <section class="c-cols">
            <div class="c-panel">
              <div class="c-panel-head"><b>BOOKS</b><span>/ 3</span><span class="right">SORT: UPDATED</span></div>
              <table class="c-table"><thead><tr><th>BOOK</th><th>WORDS</th><th>COVERAGE</th><th>STATE</th><th>UPDATED</th></tr></thead><tbody>${rowsC()}</tbody></table>
            </div>
            <div class="c-side">
              <div class="c-panel"><div class="c-panel-head"><b>EVENT_STREAM</b><span>/ tail -5</span></div><div class="c-log">${EVENTS.map(([t,k,m]) => `<div class="c-log-row"><span class="t">${t}</span><span class="m"><b>${k}</b> ${m}</span></div>`).join("")}</div></div>
              <div class="c-panel"><div class="c-panel-head"><b>NODE</b><span>/ 01</span></div><div class="c-sys"><div><span>HOST</span><b>47.95.66.191</b></div><div><span>UPTIME</span><b>12d 04h</b></div><div><span>HEAP</span><b>312 MB</b></div><div><span>QUEUE</span><b>0</b></div></div></div>
            </div>
          </section>
          <footer class="c-foot"><span>SHORTHAND ADMIN // TERMINAL</span><span>BUILD 0.4.2 · NODE 01</span></footer>
        </main>
      </div>`;
  }

  function render() {
    document.body.className = `v-${state.variant}`;
    const app = document.getElementById("app");
    app.innerHTML = state.variant === "A" ? renderA() : state.variant === "B" ? renderB() : renderC();
    renderSwitcher();
    const input = app.querySelector("[data-search]");
    if (input) input.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      app.querySelectorAll("tbody tr").forEach((tr) => {
        tr.style.display = tr.innerText.toLowerCase().includes(q) ? "" : "none";
      });
    });
  }

  function renderSwitcher() {
    document.getElementById("switcher").innerHTML = `
      <button data-nav="prev" aria-label="上一个变体">‹</button>
      <span><b>${state.variant}</b> · ${VARIANTS[state.variant]}</span>
      <button data-nav="next" aria-label="下一个变体">›</button>`;
  }

  function setVariant(v) {
    state.variant = v;
    const url = new URL(location.href);
    url.searchParams.set("variant", v);
    history.replaceState(null, "", url);
    render();
  }

  document.getElementById("app").addEventListener("click", (e) => {
    const nav = e.target.closest(".a-nav button, .b-nav button");
    if (nav) {
      const group = nav.parentElement;
      group.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
      nav.classList.add("active");
    }
  });

  document.getElementById("switcher").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-nav]");
    if (!btn) return;
    const keys = Object.keys(VARIANTS);
    let i = keys.indexOf(state.variant);
    i = btn.dataset.nav === "prev" ? (i + keys.length - 1) % keys.length : (i + 1) % keys.length;
    setVariant(keys[i]);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    const keys = Object.keys(VARIANTS);
    let i = keys.indexOf(state.variant);
    i = e.key === "ArrowLeft" ? (i + keys.length - 1) % keys.length : (i + 1) % keys.length;
    setVariant(keys[i]);
  });

  render();
</script>
</body>
</html>
