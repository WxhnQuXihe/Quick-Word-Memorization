server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: shorthand-server
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/shorthand?useUnicode=true&characterEncoding=UTF-8&characterSetResults=utf8mb4&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_SIZE:6}
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
  token-secret: ${APP_TOKEN_SECRET:shorthand-dev-secret-change-me}
  token-days: ${APP_TOKEN_DAYS:90}
  latest-version: ${APP_LATEST_VERSION:0.5.1}
  download-url: ${APP_DOWNLOAD_URL:https://github.com/WxhnQuXihe/Quick-Word-Memorization/releases/latest}
  update-notes: ${APP_UPDATE_NOTES:修复问题并带来新的主页体验}
