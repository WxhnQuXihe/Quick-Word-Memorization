name: sync-audio-overrides

on:
  push:
    paths:
      - 'audio-overrides/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install requests
        run: python -m pip install --quiet requests

      - name: Sync changed overrides
        env:
          API_BASE: http://47.95.66.191:8082
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only HEAD^ HEAD -- audio-overrides | tr '\n' ',')
          else
            CHANGED=""
          fi
          python tools/audio/sync_overrides.py --changed "$CHANGED"
