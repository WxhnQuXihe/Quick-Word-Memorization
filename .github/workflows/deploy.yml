name: deploy-shortand

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build server
        working-directory: server
        run: mvn -B -DskipTests package

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            admin/package-lock.json

      - name: Build app
        working-directory: app
        env:
          VITE_API_BASE: /api
        run: npm ci && npm run build

      - name: Build admin
        working-directory: admin
        run: npm ci && npm run build

      - name: Assemble
        run: |
          mkdir -p deploy/web/admin
          cp -r app/dist/* deploy/web/
          cp -r admin/dist/* deploy/web/admin/
          cp server/target/shortand-server-*.jar deploy/server.jar

      - uses: actions/upload-artifact@v4
        with:
          name: shortand-dist
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shortand-dist
          path: deploy

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/*"
          target: "/home/deploy/upload-shortand"
          strip_components: 1

      - name: Restart & health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/upload-shortand
            chmod 644 server.jar
            chmod -R a+rX web

            cp /opt/shortand/releases/server.jar /opt/shortand/releases/server.jar.prev 2>/dev/null || true
            cp server.jar /opt/shortand/releases/server.jar
            rsync -a --delete web/ /opt/shortand/web/

            sudo systemctl restart shortand

            for i in $(seq 1 45); do
              if curl -fsS http://127.0.0.1:8081/actuator/health >/dev/null; then
                echo "healthy"
                exit 0
              fi
              sleep 2
            done

            echo "health check failed, rollback"
            if [ -f /opt/shortand/releases/server.jar.prev ]; then
              cp /opt/shortand/releases/server.jar.prev /opt/shortand/releases/server.jar
              sudo systemctl restart shortand
            fi
            exit 1
